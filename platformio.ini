; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = .
src_dir = examples/RedEyeSerial

[env]
framework = arduino

[usbasp]
upload_protocol = usbasp

[avr]
platform = atmelavr
upload_flags =
	-v
	-e

[env:Uno]
extends = avr
board = uno
debug_tool = simavr

[env:Nano]
extends = avr
board = nanoatmega328
debug_tool = simavr

[env:Mega]
extends = avr
board = megaatmega2560
debug_tool = simavr

[env:Micro]
extends = avr
board = micro
build_flags =
	-D REDEYE_USE_TIMER=3
	-D REDEYE_RX_PIN=2
	-D REDEYE_TX_PIN=11
	-D REDEYE_INVERTED=0

[env:ATtiny84]
extends = avr, usbasp
board = attiny84
board_build.variant = tinyX4_reverse

[env:ATtiny84-16MHz]
extends = env:ATtiny84
board_build.f_cpu = 16000000L


[ATtiny1634]
extends = avr, usbasp
board = attiny1634
build_flags =
	-D REDEYE_RX_PIN=11
	-D REDEYE_TX_PIN=13
	-D REDEYE_USE_TIMER=1

[env:ATtiny1634-8MHz]
extends = ATtiny1634
board_build.f_cpu = 8000000L

[env:ATtiny1634-12MHz]
extends = ATtiny1634
board_build.f_cpu = 12000000L

[env:ATtiny1634-16MHz]
extends = ATtiny1634
board_build.f_cpu = 16000000L

[env:ATmega164P]
extends = avr, usbasp
board = ATmega164P
board_build.f_cpu = 16000000L
board_build.variant = standard
board_hardware.oscillator = external
board_bootloader.type = no_bootloader
board_hardware.uart = no_bootloader
board_hardware.eesave = yes
board_hardware.jtagen = yes

[env:ATmega328P]
extends = avr, usbasp
board = ATmega328P
board_bootloader.type = no_bootloader
board_hardware.uart = no_bootloader
